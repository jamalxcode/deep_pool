# deep pool's node services, for the Mac mini (OrbStack or Docker Desktop).
# Bitcoin Core runs natively on macOS (see README.md); everything else runs here:
#
#   visitors' browsers ──▶ Cloudflare ──tunnel──▶ gateway (Caddy: allowlist, read-only, cache hints)
#                                                    └──▶ mempool backend ──▶ Bitcoin Core (on the Mac)
#                                                                        └──▶ MariaDB
#
# No port is opened on the router: the tunnel connects out to Cloudflare.
# There's no Electrs: the node serves the dashboard only, and deep pool sends address and
# transaction lookups to mempool.space and blockstream.info (nodeLookups: false in config.js).
# Fill in .env (copy .env.example), then: docker compose up -d

name: deep-pool-node

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mempool
      MYSQL_USER: mempool
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ${DATA_DIR}/mysql:/var/lib/mysql

  mempool:
    # The mempool.space backend: the same /api deep pool already speaks.
    # Check https://hub.docker.com/r/mempool/backend/tags for the newest version before starting.
    image: mempool/backend:v3.0.0
    restart: unless-stopped
    stop_grace_period: 1m
    user: "1000:1000"
    depends_on: [db]
    command: ./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh
    environment:
      MEMPOOL_NETWORK: mainnet
      MEMPOOL_BACKEND: none
      CORE_RPC_HOST: host.docker.internal
      CORE_RPC_PORT: "8332"
      CORE_RPC_USERNAME: ${BITCOIN_RPC_USER}
      CORE_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD}
      DATABASE_ENABLED: "true"
      DATABASE_HOST: db
      DATABASE_DATABASE: mempool
      DATABASE_USERNAME: mempool
      DATABASE_PASSWORD: ${DB_PASSWORD}
      STATISTICS_ENABLED: "true"
    volumes:
      - ${DATA_DIR}/mempool-cache:/backend/cache

  gateway:
    # The only thing the tunnel can reach: just the calls deep pool makes, read-only, deep pool's
    # address only, with cache hints for Cloudflare.
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on: [mempool]
    environment:
      DEEPPOOL_ORIGIN: ${DEEPPOOL_ORIGIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # For checking from the Mac itself (http://localhost:8080/api/v1/blocks/tip/height).
      # Bound to 127.0.0.1, so not reachable from the network.
      - "127.0.0.1:8080:8080"

  tunnel:
    # Connects out to Cloudflare; Cloudflare sends https://<your node hostname> here.
    # Check https://hub.docker.com/r/cloudflare/cloudflared/tags for the newest version before starting.
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    depends_on: [gateway]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
